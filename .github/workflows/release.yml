name: Release

# Pushing a `v*` tag builds every platform into one draft release with updater
# artifacts and latest.json. Installed apps only see it after the draft is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for version in \
            "$(node -p "require('./package.json').version")" \
            "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"; do
            if [ "$version" != "$expected" ]; then
              echo "::error::Found version $version, but the tag is $GITHUB_REF_NAME. Update package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json."
              exit 1
            fi
          done
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `vivin ${tag.replace(/^v/, '')}`,
              body: '在此填写本次更新内容。发布后，已安装的 vivin 会在“设置 → 关于”和启动检查中提示更新。',
              draft: true,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - runner: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
